name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Verify the generated API types
        run: |
          npm run generate:types
          git diff --exit-code -- src/app/features/runs/domain/contract.generated.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-store-agent-orchestrator-web:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke-test container routing and authorization forwarding
        run: |
          set -euo pipefail
          python3 -u - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Upstream(BaseHTTPRequestHandler):
              def do_GET(self):
                  expected = self.path == "/api/v1/runs?limit=1" and self.headers.get("Authorization") == "Bearer ci-web-only"
                  self.send_response(200 if expected else 400)
                  self.end_headers()

          HTTPServer(("127.0.0.1", 18081), Upstream).serve_forever()
          PY
          upstream="$!"
          web=""
          cleanup() {
            if [[ -n "$web" ]]; then docker rm -f "$web" >/dev/null; fi
            kill "$upstream"
          }
          trap cleanup EXIT
          web="$(docker run -d --network host -e AO_API_URL=http://127.0.0.1:18081 ecommerce-store-agent-orchestrator-web:ci)"
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --max-time 4 \
            http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/runs/sample | grep '<app-root' >/dev/null
          curl --fail --silent --show-error -H 'Authorization: Bearer ci-web-only' \
            'http://127.0.0.1:8080/api/v1/runs?limit=1'

      - name: Scan the Web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-agent-orchestrator-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Record the scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-agent-orchestrator-web:ci)"
          test -n "$image_id"
          printf 'SCANNED_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'Scanned image ID: %s\n' "$image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag and publish the scanned Web image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          set -euo pipefail
          image="docker.io/${DOCKER_USER}/ecommerce-store-agent-orchestrator-web"
          sha_tag="${image}:${GITHUB_SHA}"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' ecommerce-store-agent-orchestrator-web:ci)"

          docker tag ecommerce-store-agent-orchestrator-web:ci "$sha_tag"
          test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          docker push "$sha_tag" | tee "$RUNNER_TEMP/image-push-sha.log"
          sha_digest="$(awk '/digest: sha256:/ { digest=$3 } END { print digest }' "$RUNNER_TEMP/image-push-sha.log")"
          [[ "$sha_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            latest_tag="${image}:latest"
            docker tag ecommerce-store-agent-orchestrator-web:ci "$latest_tag"
            test "$SCANNED_IMAGE_ID" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"
            docker push "$latest_tag" | tee "$RUNNER_TEMP/image-push-latest.log"
            latest_digest="$(awk '/digest: sha256:/ { digest=$3 } END { print digest }' "$RUNNER_TEMP/image-push-latest.log")"
            test "$sha_digest" = "$latest_digest"
          fi

          mkdir -p artifacts
          jq -n --arg image "${image}@${sha_digest}" --arg commit "$GITHUB_SHA" \
            '{application: "agent_orchestrator_web", imageReference: $image, commitSha: $commit}' > artifacts/image-reference.json
          printf 'Published %s from scanned image %s with digest %s.\n' \
            "$sha_tag" "$SCANNED_IMAGE_ID" "$sha_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the immutable image reference
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: image-reference
          path: artifacts/image-reference.json
          if-no-files-found: error
